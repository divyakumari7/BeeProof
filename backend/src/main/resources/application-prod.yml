spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:beeproof_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:beeproof_user}
    password: ${DB_PASSWORD:BeeProofSecret2026!}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
