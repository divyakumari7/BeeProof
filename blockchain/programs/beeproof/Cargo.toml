[package]
name = "beeproof"
version = "0.1.0"
description = "BeeProof Honey Traceability Solana Anchor Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "beeproof"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"


borsh = "=1.5.1"
borsh-derive = "=1.5.1"
zeroize_derive = "=1.4.2"
proc-macro-crate = "=1.3.1"
toml = "=0.5.11"
toml_datetime = "=0.6.8"
toml_edit = "=0.21.1"
hashbrown = "=0.14.5"
indexmap = "=2.1.0"
block-buffer = "=0.10.4"
constant_time_eq = "=0.3.0"
jobserver = "=0.1.32"
digest = "=0.10.7"
sha2 = "=0.10.8"
sha3 = "=0.10.8"
blake3 = "=1.5.0"
hybrid-array = "=0.2.0-rc.4"
getrandom = "=0.2.15"
thiserror = "=1.0.64"
thiserror-impl = "=1.0.64"
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false










